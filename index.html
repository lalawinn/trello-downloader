<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Image Downloader connector</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
</head>
<body>
<script>
  var ICON = 'https://lalawinn.github.io/trello-downloader/icon.svg';
  var CAL_ICON = 'https://lalawinn.github.io/trello-downloader/calendar-icon.svg';
  var CAL_ICON_WHITE = 'https://lalawinn.github.io/trello-downloader/calendar-icon-white.svg';

  TrelloPowerUp.initialize({
    'card-buttons': function (t) {
      return [{
        icon: ICON,
        text: 'Download All Images',
        callback: function (t) {
          return t.popup({
            title: 'Download all images',
            url: './download.html?v=8',
            height: 340
          });
        }
      }];
    },
    'board-buttons': function (t) {
      return [{
        icon: { dark: CAL_ICON_WHITE, light: CAL_ICON },
        text: 'Calendar',
        callback: function (t) {
          return t.modal({
            title: 'Team calendar',
            url: './calendar.html?v=1',
            fullscreen: true
          });
        }
      }];
    }
  }, {
    appKey: '6ad8d209bae01b2d381ca357d8072e1b',
    appName: 'Image Downloader'
  });
</script>
</body>
</html>
