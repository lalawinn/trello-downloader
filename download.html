<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Download all images</title>
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; color: #172b4d; margin: 0; padding: 8px; }
    button { background: #0c66e4; color: #fff; border: 0; border-radius: 3px; padding: 8px 14px; font-size: 14px; cursor: pointer; width: 100%; }
    button:hover { background: #0055cc; }
    button:disabled { background: #a5adba; cursor: default; }
    #bar-wrap { background: #dfe1e6; border-radius: 3px; height: 8px; margin: 12px 0 6px; overflow: hidden; display: none; }
    #bar { background: #0c66e4; height: 100%; width: 0; transition: width .2s; }
    #status { margin: 6px 0; line-height: 1.4; }
    #fallback { display: none; margin-top: 6px; }
    a { color: #0c66e4; }
    .err { color: #ae2a19; }
    #list { display: none; margin-top: 8px; max-height: 140px; overflow-y: auto; }
    #list a { display: block; padding: 3px 0; word-break: break-all; }
    #seq { display: none; margin-top: 8px; background: #fff; color: #0c66e4; border: 1px solid #0c66e4; }
    #seq:hover { background: #e9f2ff; }
  </style>
</head>
<body>
  <button id="go">Download all images</button>
  <div id="bar-wrap"><div id="bar"></div></div>
  <div id="status">Click the button to bundle every image on this card into one zip file.</div>
  <div id="fallback"></div>
  <div id="ver" style="margin-top:10px;font-size:11px;color:#6b778c;"></div>
  <button id="seq">Download images one by one</button>
  <div id="list"></div>

<script>
  var APP_KEY = '6ad8d209bae01b2d381ca357d8072e1b';
  // Paste your Cloudflare Worker address here, e.g. https://trello-image-helper.yourname.workers.dev
  var WORKER_URL = 'https://trello-image-helper.lana-winnichyn.workers.dev';
  var t = TrelloPowerUp.iframe({ appKey: APP_KEY, appName: 'Image Downloader' });

  var btn = document.getElementById('go');
  document.getElementById('ver').textContent = 'Version 5 - helper ' + (WORKER_URL.indexOf('http') === 0 ? 'set' : 'NOT set');
  var statusEl = document.getElementById('status');
  var barWrap = document.getElementById('bar-wrap');
  var bar = document.getElementById('bar');
  var fallback = document.getElementById('fallback');

  function setStatus(msg, isError) {
    statusEl.textContent = msg;
    statusEl.className = isError ? 'err' : '';
    t.sizeTo('body').catch(function () {});
  }

  function setProgress(done, total) {
    barWrap.style.display = 'block';
    bar.style.width = Math.round((done / total) * 100) + '%';
  }

  function isImage(a) {
    if (a.mimeType && a.mimeType.indexOf('image/') === 0) return true;
    return /\.(png|jpe?g|gif|webp|bmp|svg|heic|tiff?)(\?.*)?$/i.test(a.url || a.name || '');
  }

  function safeName(name) {
    return (name || 'image').replace(/[\\/:*?"<>|]/g, '_');
  }

  // Keep every filename unique inside the zip: photo.jpg, 2-photo.jpg, ...
  function makeNamer() {
    var used = {};
    return function (name) {
      var base = safeName(name);
      if (!used[base]) { used[base] = 1; return base; }
      var n = ++used[base];
      var candidate = n + '-' + base;
      while (used[candidate]) { n++; candidate = n + '-' + base; }
      used[candidate] = 1;
      return candidate;
    };
  }

  async function getToken() {
    var api = t.getRestApi();
    var authorized = await api.isAuthorized();
    if (!authorized) {
      // Must be called from a click, so this runs inside the button handler.
      await api.authorize({ scope: 'read', expiration: 'never' });
    }
    return api.getToken();
  }

  async function fetchAttachment(cardId, a, token) {
    if (a.isUpload && WORKER_URL.indexOf('http') === 0) {
      var u = WORKER_URL.replace(/\/$/, '') + '/?card=' + encodeURIComponent(cardId) +
              '&att=' + encodeURIComponent(a.id) + '&name=' + encodeURIComponent(a.name);
      var r;
      try {
        r = await fetch(u, { headers: { 'X-Trello-Key': APP_KEY, 'X-Trello-Token': token } });
      } catch (e) {
        throw new Error('could not reach the helper (' + e.message + ')');
      }
      if (!r.ok) throw new Error('helper answered HTTP ' + r.status);
      return r.blob();
    }
    // Linked (non-uploaded) image: fetch directly from its own website.
    var res2 = await fetch(a.url);
    if (!res2.ok) throw new Error('HTTP ' + res2.status);
    return res2.blob();
  }

  // Fallback: the browser blocked the zip method, so download each image
  // using the person's own Trello login (same as the Download option on a card).
  function showIndividual(images) {
    setStatus('Trello blocked bundling these into a zip, so use one-by-one download instead. ' +
              'Your browser may ask to allow multiple downloads. Click Allow.', false);
    var seq = document.getElementById('seq');
    var list = document.getElementById('list');
    seq.style.display = 'block';
    list.style.display = 'block';
    list.innerHTML = '';
    images.forEach(function (a, i) {
      var link = document.createElement('a');
      link.href = a.url;
      link.target = '_blank';
      link.rel = 'noopener';
      link.textContent = (i + 1) + '. ' + a.name;
      list.appendChild(link);
    });
    seq.onclick = function () {
      seq.disabled = true;
      var n = 0;
      (function next() {
        if (n >= images.length) {
          setStatus('Started ' + images.length + ' download' + (images.length === 1 ? '' : 's') +
                    '. If some did not arrive, click the links below one at a time.');
          seq.disabled = false;
          return;
        }
        var frame = document.createElement('iframe');
        frame.style.display = 'none';
        frame.src = images[n].url;
        document.body.appendChild(frame);
        n++;
        setStatus('Starting download ' + n + ' of ' + images.length + '...');
        setTimeout(next, 900);
      })();
    };
    t.sizeTo('body').catch(function () {});
  }

  async function run() {
    btn.disabled = true;
    fallback.style.display = 'none';
    document.getElementById('seq').style.display = 'none';
    document.getElementById('list').style.display = 'none';
    barWrap.style.display = 'none';
    bar.style.width = '0';

    try {
      setStatus('Checking Trello access...');
      var token = await getToken();
      if (!token) throw new Error('Trello did not give this Power-Up access. Click the button to try again.');

      var card = await t.card('id', 'name', 'attachments');
      var images = (card.attachments || []).filter(isImage);

      if (!images.length) {
        setStatus('No images found on this card.');
        btn.disabled = false;
        return;
      }

      var zip = new JSZip();
      var nameFor = makeNamer();
      var failed = [];

      for (var i = 0; i < images.length; i++) {
        var a = images[i];
        setStatus('Downloading ' + (i + 1) + ' of ' + images.length + ': ' + a.name);
        setProgress(i, images.length);
        try {
          var blob = await fetchAttachment(card.id, a, token);
          zip.file(nameFor(a.name), blob);
        } catch (e) {
          failed.push({ att: a, reason: e.message });
        }
      }
      setProgress(images.length, images.length);

      var okCount = images.length - failed.length;
      if (okCount === 0) {
        showIndividual(images);
        setStatus('The zip step failed: ' + failed[0].reason + '. Please send this message to Claude.', true);
        return;
      }

      setStatus('Creating zip file...');
      var out = await zip.generateAsync({ type: 'blob' });
      var zipName = safeName(card.name) + ' - images.zip';
      var href = URL.createObjectURL(out);

      var link = document.createElement('a');
      link.href = href;
      link.download = zipName;
      document.body.appendChild(link);
      link.click();
      link.remove();

      var msg = 'Done. ' + okCount + ' image' + (okCount === 1 ? '' : 's') + ' zipped.';
      if (failed.length) {
        msg += ' ' + failed.length + ' could not be downloaded: ' +
               failed.map(function (f) { return f.att.name; }).join(', ') + '.';
      }
      setStatus(msg, failed.length > 0);

      fallback.style.display = 'block';
      fallback.innerHTML = 'Download did not start? <a id="manual" href="' + href +
                           '" download="' + zipName.replace(/"/g, '') + '">Save the zip</a>';
    } catch (err) {
      console.error(err);
      setStatus('Something went wrong: ' + (err && err.message ? err.message : err), true);
    } finally {
      btn.disabled = false;
    }
  }

  btn.addEventListener('click', run);
  t.render(function () { t.sizeTo('body'); });
</script>
</body>
</html>
